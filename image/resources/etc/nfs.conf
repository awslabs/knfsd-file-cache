# https://manpages.ubuntu.com/manpages/noble/man5/nfs.conf.5.html
[exports]
rootdir=/srv/nfs

[nfsd]
port=2049

[mountd]
port=20048
manage-gids=no

[statd]
port=20051
outgoing-port=20052

[lockd]
port=20053

[sm-notify]
outgoing-port=20054

[reexport]
sqlitedb=/var/lib/nfs/fsids.sqlite
backend_plugin=/lib/libnfsreexport_backends/sqlite.so
fsidd_socket=/run/fsidd.sock
