# Restore the pre-native-unit start semantics. Without -n, cachefilesd binds
# the cache and then forks, so "systemctl start" blocks until the cache is
# bound and fails if the bind fails. -s is dropped because the daemonised
# child redirects stderr to /dev/null; messages go to syslog (the journal).
[Service]
Type=forking
ExecStart=
ExecStart=/usr/sbin/cachefilesd $DAEMON_OPTS
