# Ubuntu 26.04 uses systemd v259: https://www.freedesktop.org/software/systemd/man/259/systemd.timer.html
# ONE empty assignment resets ALL monotonic timers (OnActiveSec, OnUnitInactiveSec,
# etc.) inherited from the packaged unit. Do NOT reset again after adding a value,
# or the reset wipes the value just added.
[Timer]
OnActiveSec=
OnActiveSec=30
OnUnitInactiveSec=30
RandomizedDelaySec=0
AccuracySec=1s
