        new_name: netfs/objects/subreqs

      - action: update
        include: netfs.objects.write_conflicts
        new_name: netfs/objects/write_conflicts

      - action: update
        include: netfs.reads.direct
        new_name: netfs/reads/direct

      - action: update
        include: netfs.reads.folio
        new_name: netfs/reads/folio

      - action: update
        include: netfs.reads.readahead
        new_name: netfs/reads/readahead

      - action: update
        include: netfs.reads.single
        new_name: netfs/reads/single

      - action: update
        include: netfs.reads.write_begin
        new_name: netfs/reads/write_begin

      - action: update
        include: netfs.reads.write_zskip
        new_name: netfs/reads/write_zskip

      - action: update
        include: netfs.retries.read_req
        new_name: netfs/retries/read_req

      - action: update
        include: netfs.retries.read_subreq
        new_name: netfs/retries/read_subreq

      - action: update
        include: netfs.retries.write_req
        new_name: netfs/retries/write_req

      - action: update
        include: netfs.retries.write_subreq
        new_name: netfs/retries/write_subreq

      - action: update
        include: netfs.upload.done
        new_name: netfs/upload/done

      - action: update
        include: netfs.upload.failed
        new_name: netfs/upload/failed

      - action: update
        include: netfs.upload.requests
        new_name: netfs/upload/requests

      - action: update
        include: netfs.wblock.skip
        new_name: netfs/wblock/skip

      - action: update
        include: netfs.wblock.wait
        new_name: netfs/wblock/wait

      - action: update
        include: netfs.writes.buffered
        new_name: netfs/writes/buffered

      - action: update
        include: netfs.writes.copy_to_cache
        new_name: netfs/writes/copy_to_cache

      - action: update
        include: netfs.writes.direct
        new_name: netfs/writes/direct

      - action: update
        include: netfs.writes.pages
        new_name: netfs/writes/pages

      - action: update
        include: netfs.writes.writethrough
        new_name: netfs/writes/writethrough

      - action: update
        include: netfs.zero_ops.short
        new_name: netfs/zero_ops/short

      - action: update
        include: netfs.zero_ops.skip
        new_name: netfs/zero_ops/skip

      - action: update
        include: netfs.zero_ops.zero
        new_name: netfs/zero_ops/zero

      # fsid daemon metrics, these are reported via the oltp receiver
      - action: update
        include: fsid.operation.count
        new_name: fsid/operation/count

      - action: update
        include: fsid.operation.duration
        new_name: fsid/operation/duration

      - action: update
        include: fsid.request.count
        new_name: fsid/request/count

      - action: update
        include: fsid.request.duration
        new_name: fsid/request/duration

      - action: update
        include: fsid.request.retries
        new_name: fsid/request/retries

      - action: update
        include: fsid.sql.query.count
        new_name: fsid/sql/query/count

      - action: update
        include: fsid.sql.query.duration
        new_name: fsid/sql/query/duration

      # prefix all custom metrics with "knfsd/"
      - action: update
        include: ^(.*)$$
        match_type: regexp
        new_name: knfsd/$$1

exporters:
  # Useful when developing or debugging metrics. When running the agent from the
  # command line this will write the metrics to the terminal.
  # debug:
  #   verbosity: basic

  awsemf:
    log_group_name: "/knfsd/metrics"
    log_retention: 30
    max_retries: 3
    namespace: "/knfsd/metrics"
    dimension_rollup_option: NoDimensionRollup
    resource_to_telemetry_conversion:
      enabled: true

  prometheus:
    endpoint: "localhost:9090"
    send_timestamps: false
    resource_to_telemetry_conversion:
      enabled: true

service:
  telemetry:
    logs:
      level: info

    metrics:
      # disable telemetry, scraping these might confuse the data as it would
      # generate similar metrics to the CW Agent
      level: none
      readers:
        - pull:
            exporter:
              prometheus:
                host: "localhost"
                port: 8889
