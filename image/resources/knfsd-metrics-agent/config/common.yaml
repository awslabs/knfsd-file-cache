  # This may be useful for diagnostics to indicate if the proxy is culling.
  # However, this can be expensive as it requires scanning all the cached blocks
  # in FS-Cache, so be conservative on how often this information is scraped.
  # By default this is not included in the pipeline.
  oldestfile:
    collection_interval: 10m

processors:
  resourcedetection:
    detectors: [ec2]
    ec2:
      fail_on_missing_metadata: true
      resource_attributes:
        cloud.provider:
          enabled: false
        cloud.account.id:
          enabled: false
        cloud.platform:
          enabled: false
        cloud.region:
          enabled: false
        cloud.availability_zone:
          enabled: false
        host.name:
          enabled: false
        host.id:
          enabled: true
        host.image.id:
          enabled: false
        host.type:
          enabled: false
      tags:
        - ^aws:autoscaling:groupName$

  memory_limiter:
    check_interval: 1s
    limit_mib: 512
    spike_limit_mib: 128

  transform:
    error_mode: ignore
    metric_statements:
      - replace_all_patterns(resource.attributes, "key", "ec2.tag.aws:autoscaling:groupName", "AutoScalingGroupName")
      - replace_all_patterns(resource.attributes, "key", "host.id", "InstanceId")

  # NOTE: the open telemetry collector will interpolate environment variables
  # Thus $1 will be replaced with the value of the environment variable named "1"
  # This is escaped by using two dollars, thus use $$ in regexp.
  metrics_transform:
    transforms:
      - action: update
        include: nfs.clients
        new_name: nfs_clients

      - action: update
        include: nfs.connections
        new_name: nfs_connections

      - action: update
        include: nfs.mount.read_rtt
        new_name: nfsiostat_mount_read_rtt

      - action: update
        include: nfs.mount.read_exe
        new_name: nfsiostat_mount_read_exe

      - action: update
        include: nfs.mount.write_rtt
        new_name: nfsiostat_mount_write_rtt

      - action: update
        include: nfs.mount.write_exe
        new_name: nfsiostat_mount_write_exe

      - action: update
        include: nfs.mount.ops_per_second
        new_name: nfsiostat_ops_per_second

      - action: update
        include: nfs.mount.rpc_backlog
        new_name: nfsiostat_rpc_backlog

      - action: update
        include: nfs.mount.read_bytes
        new_name: mount/read_bytes

      - action: update
        include: nfs.mount.write_bytes
        new_name: mount/write_bytes

      - action: update
        include: nfs.mount.operation.requests
        new_name: mount/operation/requests

      - action: update
        include: nfs.mount.operation.sent_bytes
        new_name: mount/operation/sent_bytes

      - action: update
        include: nfs.mount.operation.received_bytes
        new_name: mount/operation/received_bytes

      - action: update
        include: nfs.mount.operation.major_timeouts
        new_name: mount/operation/major_timeouts

      - action: update
        include: nfs.mount.operation.errors
        new_name: mount/operation/errors

      - action: update
        include: nfs.packets.arrived
        new_name: nfs_packets_arrived

      - action: update
        include: nfs.packets.deferred
        new_name: nfs_packets_deferred

      - action: update
        include: nfs.sockets.enqueued
        new_name: nfs_sockets_enqueued

      - action: update
        include: nfs.threads
        new_name: nfs_threads

      - action: update
        include: nfs.threads.timedout
        new_name: nfs_threads_timedout

      - action: update
        include: nfs.threads.woken
        new_name: nfs_threads_woken

      - action: update
        include: nfs.exports.total_operations
        new_name: exports/total_operations

      - action: update
        include: nfs.exports.total_read_bytes
        new_name: exports/total_read_bytes

      - action: update
        include: nfs.exports.total_write_bytes
        new_name: exports/total_write_bytes

      - action: update
        include: slab.dentry_cache.active_objects
        new_name: dentry_cache_active_objects

      - action: update
        include: slab.dentry_cache.objsize
        new_name: dentry_cache_objsize

      - action: update
        include: slab.nfs_inode_cache.objsize
        new_name: nfs_inode_cache_objsize

      - action: update
        include: slab.nfs_inode_cache.active_objects
        new_name: nfs_inode_cache_active_objects

      - action: update
        include: fscache.oldest_file
        new_name: fscache/oldest_file

      # FS-Cache metrics (from /proc/fs/fscache/stats)
      - action: update
        include: fscache.acquire.ok
        new_name: fscache/acquire/ok

      - action: update
        include: fscache.acquire.oom
        new_name: fscache/acquire/oom

      - action: update
        include: fscache.acquire.requests
        new_name: fscache/acquire/requests

      - action: update
        include: fscache.cookies.data
        new_name: fscache/cookies/data

      - action: update
        include: fscache.cookies.volume
        new_name: fscache/cookies/volume

      - action: update
        include: fscache.cookies.volume_collisions
        new_name: fscache/cookies/volume_collisions

      - action: update
        include: fscache.cookies.volume_oom
        new_name: fscache/cookies/volume_oom

      - action: update
        include: fscache.invalidations
        new_name: fscache/invalidations

      - action: update
        include: fscache.io.misfit
        new_name: fscache/io/misfit

      - action: update
        include: fscache.io.read
        new_name: fscache/io/read

      - action: update
        include: fscache.io.write
        new_name: fscache/io/write

      - action: update
        include: fscache.lru.count
        new_name: fscache/lru/count

      - action: update
        include: fscache.lru.dropped
        new_name: fscache/lru/dropped

      - action: update
        include: fscache.lru.expired
        new_name: fscache/lru/expired

      - action: update
        include: fscache.lru.removed
        new_name: fscache/lru/removed

      - action: update
        include: fscache.nospace.create
        new_name: fscache/nospace/create

      - action: update
        include: fscache.nospace.cull
        new_name: fscache/nospace/cull

      - action: update
        include: fscache.nospace.write
        new_name: fscache/nospace/write

      - action: update
        include: fscache.relinquish.drop
        new_name: fscache/relinquish/drop

      - action: update
        include: fscache.relinquish.requests
        new_name: fscache/relinquish/requests

      - action: update
        include: fscache.relinquish.retire
        new_name: fscache/relinquish/retire

      - action: update
        include: fscache.updates.requests
        new_name: fscache/updates/requests

      - action: update
        include: fscache.updates.resize
        new_name: fscache/updates/resize

      - action: update
        include: fscache.updates.resize_skipped
        new_name: fscache/updates/resize_skipped

      # Netfslib metrics (from /proc/fs/fscache/stats)
      - action: update
        include: netfs.cache_read.done
        new_name: netfs/cache_read/done

      - action: update
        include: netfs.cache_read.failed
        new_name: netfs/cache_read/failed

      - action: update
        include: netfs.cache_read.requests
        new_name: netfs/cache_read/requests

      - action: update
        include: netfs.cache_write.done
        new_name: netfs/cache_write/done

      - action: update
        include: netfs.cache_write.failed
        new_name: netfs/cache_write/failed

      - action: update
        include: netfs.cache_write.requests
        new_name: netfs/cache_write/requests

      - action: update
        include: netfs.download.done
        new_name: netfs/download/done

      - action: update
        include: netfs.download.failed
        new_name: netfs/download/failed

      - action: update
        include: netfs.download.instead
        new_name: netfs/download/instead

      - action: update
        include: netfs.download.requests
        new_name: netfs/download/requests

      - action: update
