type: connections

scope_name: knfsd-metrics-agent/connections

status:
  class: receiver
  stability:
    alpha: [metrics]
  codeowners:
    active: [AWS]
  unsupported_platforms: [windows]

metrics:
  nfs.connections:
    enabled: true
    stability:
      level: alpha
    description: The number of NFS Clients connected to the KNFSD filer (used for autoscaling)
    unit: "{count}"
    gauge:
      value_type: int
