type: fscache

scope_name: knfsd-metrics-agent/fscache

status:
  class: receiver
  stability:
    alpha: [metrics]
  codeowners:
    active: [AWS]
  unsupported_platforms: [windows]

metrics:
  fscache.acquire.ok:
    enabled: true
    stability:
      level: alpha
    description: Number of acquire requests that succeeded
    unit: "{requests}"
    sum:
      value_type: int
      monotonic: true
      aggregation_temporality: cumulative

  fscache.acquire.oom:
    enabled: true
    stability:
      level: alpha
    description: Number of acquire requests that failed due to ENOMEM
    unit: "{requests}"
    sum:
      value_type: int
      monotonic: true
      aggregation_temporality: cumulative

  fscache.acquire.requests:
    enabled: true
    stability:
