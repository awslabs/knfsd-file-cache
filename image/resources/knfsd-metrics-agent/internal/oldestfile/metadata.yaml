type: oldestfile

scope_name: knfsd-metrics-agent/oldestfile

status:
  class: receiver
  stability:
    alpha: [metrics]
  codeowners:
    active: [AWS]
  unsupported_platforms: [windows]

metrics:
  fscache.oldest_file:
    enabled: true
    description: Age of the oldest file in FS-Cache
    unit: s
    gauge:
      value_type: int

tests:
  config:
    cache_path: "/tmp"
