type: exports

scope_name: knfsd-metrics-agent/exports

status:
  class: receiver
  stability:
    alpha: [metrics]
  codeowners:
    active: [AWS]
  unsupported_platforms: [windows]

metrics:
  nfs.exports.total_operations:
    enabled: true
    stability:
      level: alpha
    description: Total number of NFS operations received from clients
    unit: "{operations}"
    sum:
      value_type: int
      monotonic: true
      aggregation_temporality: cumulative

  nfs.exports.total_read_bytes:
    enabled: true
    stability:
      level: alpha
    description: Total bytes read by the NFS clients
    unit: By
    sum:
      value_type: int
      monotonic: true
      aggregation_temporality: cumulative

  nfs.exports.total_write_bytes:
    enabled: true
    stability:
      level: alpha
    description: Total bytes wrote by the NFS clients
    unit: By
    sum:
      value_type: int
      monotonic: true
      aggregation_temporality: cumulative
