# https://www.checkov.io/2.Basics/CLI%20Command%20Reference.html
block-list-secret-scan: []
directory:
  - .
download-external-modules: false
evaluate-variables: true
external-modules-download-path: .external_modules
framework:
  - terraform
  - dockerfile
mask: []
secrets-history-timeout: 12h
secrets-scan-file-type: []
summary-position: bottom
skip-check:
  - CKV_AWS_91   # Ensure the ELBv2 (Application/Network) has access logging enabled
  - CKV_AWS_115  # Ensure that AWS Lambda function is configured for function-level concurrent execution limit
  - CKV_AWS_116  # Ensure that AWS Lambda function is configured for a Dead Letter Queue (DLQ)
  - CKV_AWS_117  # AWS Lambda Function is not assigned to access within VPC (false-positive, DNS-RR static-ip lambda does not require VPC access)
  - CKV_AWS_124  # Ensure that CloudFormation stacks are sending event notifications to an SNS topic (false-positive, not applicable)
  - CKV_AWS_129  # Ensure that respective logs of Amazon Relational Database Service (Amazon RDS) are enabled
  - CKV_AWS_149  # Ensure that Secrets Manager secret is encrypted using KMS CMK
  - CKV_AWS_150  # Ensure that Load Balancer has deletion protection enabled
  - CKV_AWS_152  # Ensure that Load Balancer (Network/Gateway) has cross-zone load balancing enabled (false-positive, single az-bound)
  - CKV_AWS_157  # Ensure that RDS instances have Multi-AZ enabled
  - CKV_AWS_158  # Ensure that CloudWatch Log Group is encrypted by KMS (false-positive, encrypted by default)
  - CKV_AWS_173  # Check encryption settings for Lambda environmental variable (false-positive, encrypted by default)
  - CKV_AWS_178  # Ensure fx ontap file system is encrypted by KMS using a customer managed Key (CMK)
  - CKV_AWS_184  # AWS Elastic File System (EFS) is not encrypted using Customer Managed Key (encrypted by default)
  - CKV_AWS_203  # Ensure resource is encrypted by KMS using a customer managed Key (CMK) (false-positive, encrypted by default)
  - CKV_AWS_272  # Ensure AWS Lambda function is configured to validate code-signing
  - CKV_AWS_293  # Ensure that AWS database instances have deletion protection enabled (false-positive)
  - CKV_AWS_337  # Ensure SSM parameters are using KMS CMK (unneccesary, encrypted by AWS managed key, non-sensitive data)
  - CKV_AWS_338  # Ensure CloudWatch log groups retains logs for at least 1 year (30 days is acceptable)
  - CKV_AWS_354  # Ensure RDS Performance Insights are encrypted using KMS CMKs (false-positive, encrypted by default)
  - CKV2_AWS_5   # Ensure that Security Groups are attached to another resource (false-positive, sg is attached via launch_template)
  - CKV2_AWS_23  # Route53 A Record has Attached Resource (not relevant)
  - CKV2_AWS_30  # Ensure Postgres RDS as aws_db_instance has Query Logging enabled
  - CKV2_AWS_38  # Ensure Domain Name System Security Extensions (DNSSEC) signing is enabled for Amazon Route 53 public hosted zones (false-positive, DNS private-zone not applicable)
  - CKV2_AWS_39  # Ensure Domain Name System (DNS) query logging is enabled for Amazon Route 53 hosted zones (false-positive, DNS private-zone not applicable)
  - CKV2_AWS_57  # Ensure Secrets Manager secrets should have automatic rotation enabled
  - CKV2_AWS_69  # Ensure Amazon RDS database instance configured with encryption in transit (false-positive, encrypted by default)
  - CKV2_AWS_74  # Ensure AWS Load Balancers use strong ciphers (false-positive as we only use NLB, bug in checkov v3.2.407, waiting for fix)
  - CKV_DOCKER_3 # Ensure that a user for the container has been created
  - CKV_DOCKER_7 # Ensure the base image uses a non latest version tag
  - CKV_GCP_26   # Ensure that VPC Flow Logs is enabled for every subnet in a VPC Network
  - CKV_GCP_32   # Ensure 'Block Project-wide SSH keys' is enabled for VM instances
  - CKV_GCP_37   # Ensure VM disks for critical VMs are encrypted with Customer Supplied Encryption Keys (CSEK)
  - CKV_GCP_38   # Ensure VM disks for critical VMs are encrypted with Customer Supplied Encryption Keys (CSEK)
  - CKV_GCP_39   # Ensure Compute instances are launched with Shielded VM enabled
  - CKV_GCP_49   # Ensure roles do not impersonate or manage Service Accounts used at project level
  - CKV_GCP_84   # Ensure Artifact Registry Repositories are encrypted with Customer Supplied Encryption Keys (CSEK)
  - CKV_GCP_76   # Ensure that Private google access is enabled for IPV6 (Triggered in Probe)
  - CKV_GCP_86   # Ensure Cloud build workers are private
compact: true # For the CLI output, do not display code blocks
quiet: true # For the CLI output, display only failed checks. Also disables progress bars
