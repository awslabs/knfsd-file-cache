    entrypoint: [""]
  variables:
    MKDOCS_SITE_URL: ${CI_PAGES_URL}
    MKDOCS_REPO_URL: ${CI_PROJECT_URL}
    MKDOCS_REPO_NAME: ${CI_PROJECT_PATH}
    NO_MKDOCS_2_WARNING: "true"
    DISABLE_MKDOCS_2_WARNING: "true"
  before_script:
    - pip3 install --break-system-packages mkdocs==${KNFSD_MKDOCS_VERSION} mkdocs-material==${KNFSD_MKDOCS_MATERIAL_VERSION} mkdocs-same-dir==${KNFSD_MKDOCS_SAME_DIR_VERSION}
    - mkdocs --version
  script:
    - mkdocs build --strict --site-dir site
  pages:
    publish: site
  artifacts:
    paths:
      - site
  allow_failure: false
  <<: *default-config
