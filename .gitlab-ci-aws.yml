trivy:
  stage: security
  needs: []
  image:
    name: ${CI_DEPENDENCY_PROXY_DIRECT_GROUP_IMAGE_PREFIX}/aquasec/trivy:${KNFSD_TRIVY_VERSION}
    entrypoint: [""]
  variables:
    TRIVY_DISABLE_VEX_NOTICE: "true"
  cache:
    key: trivy-${CI_COMMIT_REF_SLUG}
    paths:
      - ".trivycache"
  before_script:
    - mkdir -p ".trivycache"
    - apk --no-cache add util-linux
  script:
    - trivy --version
    # Use `script` to emulate `tty` for colored output in GitLab CI
    - script -q -c 'trivy fs --ignorefile .trivyignore.yaml --exit-code 1 --cache-dir ".trivycache" --tf-vars ".trivy.tfvars" --scanners secret,vuln,misconfig,license --timeout 10m "${CI_PROJECT_DIR}" ; echo $? > TRIVYEXIT'
    - exit $(cat TRIVYEXIT)
  allow_failure: true
  tags:
    - arch:amd64
    - size:2xlarge
  <<: *default-config

