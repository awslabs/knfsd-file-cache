# Build the MkDocs (Material/Cloudscape) documentation site and publish it to GitHub Pages.

name: docs

"on":
  push:
    branches:
      - main
  workflow_dispatch:

# Least-privilege default; the Pages scopes are granted per job below.
permissions:
  contents: read

# Allow one concurrent deployment; do not cancel an in-progress production deploy.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  # Keep in sync with .gitlab-ci-aws.yml and .devcontainer/dev/Dockerfile.
  KNFSD_MKDOCS_MATERIAL_VERSION: 9.7.7
  KNFSD_MKDOCS_SAME_DIR_VERSION: 0.1.5
  KNFSD_MKDOCS_VERSION: 1.6.1
  NO_MKDOCS_2_WARNING: "true"
  DISABLE_MKDOCS_2_WARNING: "true"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: read
    steps:
      - name: Checkout
        # https://github.com/actions/checkout/releases
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Configure GitHub Pages
        id: pages
        # https://github.com/actions/configure-pages/releases
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Set up Python
        # https://github.com/actions/setup-python/releases
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Install MkDocs
        run: |
          pip install "mkdocs==${KNFSD_MKDOCS_VERSION}" "mkdocs-material==${KNFSD_MKDOCS_MATERIAL_VERSION}" "mkdocs-same-dir==${KNFSD_MKDOCS_SAME_DIR_VERSION}"
          mkdocs --version

      - name: Build MkDocs site
        run: mkdocs build --strict --site-dir site
        env:
          # Resolve site/repo metadata from GitHub predefined variables.
          MKDOCS_SITE_URL: ${{ steps.pages.outputs.base_url }}
          MKDOCS_REPO_URL: ${{ github.server_url }}/${{ github.repository }}
          MKDOCS_REPO_NAME: ${{ github.repository }}

      - name: Upload Pages artifact
        # https://github.com/actions/upload-pages-artifact/releases
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        # https://github.com/actions/deploy-pages/releases
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
