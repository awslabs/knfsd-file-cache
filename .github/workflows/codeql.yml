name: CodeQL

"on":
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    # Weekly, matching the cadence of the previous default setup.
    - cron: "24 5 * * 1"
  workflow_dispatch:

# Least-privilege permissions required to upload CodeQL results.
permissions:
  actions: read
  contents: read
  security-events: write

# Cancel superseded in-progress runs for the same ref to avoid piling up.
concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: go
            build-mode: autobuild
          - language: python
            build-mode: none
    steps:
      # Reclaim ~20-30 GB before CodeQL initializes. Only needed for the Go
      # analysis, whose dependency-graph extraction is what fills the disk.
      # tool-cache: false is deliberate -- the CodeQL bundle lives in the tool
      # cache, so removing it would break the run.
      - name: Free disk space
        if: matrix.language == 'go'
        # https://github.com/jlumbroso/free-disk-space/releases
        uses: jlumbroso/free-disk-space@ceedf095f4ec1a097402bc6bd80831f2e1a6fde6 # v2.0.0
        with:
          preinstalled-runtimes: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Checkout
        # https://github.com/actions/checkout/releases
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CodeQL
        # https://github.com/github/codeql-action/releases
        uses: github/codeql-action/init@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: Perform CodeQL Analysis
        # https://github.com/github/codeql-action/releases
        uses: github/codeql-action/analyze@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          category: "/language:${{ matrix.language }}"
