name: CodeQL

"on":
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    # Weekly, matching the cadence of the previous default setup.
    - cron: "24 5 * * 1"
  workflow_dispatch:

# Least-privilege permissions required to upload CodeQL results.
permissions:
  contents: read
  security-events: write

# Cancel superseded in-progress runs for the same ref to avoid piling up.
concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: go
            build-mode: autobuild
          - language: python
            build-mode: none
    steps:
      # Reclaim ~20-30 GB before CodeQL initializes. Only needed for the Go
      # analysis, whose dependency-graph extraction is what fills the disk.
      # tool-cache: false is deliberate -- the CodeQL bundle lives in the tool
      # cache, so removing it would break the run.
      - name: Free disk space
        if: matrix.language == 'go'
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.1
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"
