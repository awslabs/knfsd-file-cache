include:
  - remote: 'https://gitlab.com/renovate-bot/renovate-runner/-/raw/main/templates/renovate-config-validator.gitlab-ci.yml'
  - remote: 'https://gitlab.com/renovate-bot/renovate-runner/-/raw/main/templates/renovate.gitlab-ci.yml'

# default settings for all jobs unless overridden
default:
  retry: # Automatically retry on any system blips
    max: 1
    when:
      - runner_system_failure
  interruptible: false
  tags:
    - arch:amd64
    - size:medium

stages:
  - dependencies
  - config
  - shell
  - packer
  - terraform
  - python
  - test
  - build
  - security

variables:
  GIT_DEPTH: 10
  FF_USE_FASTZIP: "true"
  ARTIFACT_COMPRESSION_LEVEL: "fastest"
  CACHE_COMPRESSION_LEVEL: "fastest"
  KNFSD_ALPINE_VERSION: 3.22.0 # https://hub.docker.com/_/alpine/tags
  KNFSD_BLACK_VERSION: 25.1.0 # https://github.com/psf/black/releases
  KNFSD_BOTO3_VERSION: 1.38.29 # https://github.com/boto/boto3/tags
  KNFSD_CHECKOV_VERSION: 3.2.436 # https://hub.docker.com/r/bridgecrew/checkov/tags
  KNFSD_CODESPELL_VERSION: 2.4.1 # https://github.com/codespell-project/codespell/releases
  KNFSD_EDITORCONFIG_VERSION: 3.3.0 # https://github.com/editorconfig-checker/editorconfig-checker/releases
  KNFSD_GOLANGCI_LINT_VERSION: 2.1.6 # https://github.com/golangci/golangci-lint/releases
  KNFSD_GOLANG_VERSION: 1.24.3 # https://go.dev/dl/
  KNFSD_GOSEC_VERSION: 2.22.4 # https://github.com/securego/gosec/releases
  KNFSD_GOVULNCHECK_VERSION: 1.1.4 # https://pkg.go.dev/golang.org/x/vuln/cmd/govulncheck
  KNFSD_KANIKO_VERSION: 1.24.0 # https://github.com/GoogleContainerTools/kaniko/releases
  KNFSD_KICS_VERSION: 2.1.9 # https://github.com/Checkmarx/kics/releases
  KNFSD_MYPY_VERSION: 1.16.0 # https://github.com/python/mypy/tags
  KNFSD_PACKER_VERSION: 1.13.0 # https://github.com/hashicorp/packer/releases
  KNFSD_POSTGRES_VERSION: 17.5-alpine3.22 # https://hub.docker.com/_/postgres
  KNFSD_PSYCOPG_VERSION: 3.2.9 # https://pypi.org/project/psycopg/
  KNFSD_PYLINT_VERSION: 3.3.7 # https://github.com/pylint-dev/pylint/tags
  KNFSD_PYTHON_VERSION: 3.13.3 # https://hub.docker.com/_/python/tags
  KNFSD_SHELLCHECK_VERSION: 0.10.0 # https://github.com/koalaman/shellcheck/releases
  KNFSD_SHFMT_VERSION: 3.11.0 # https://github.com/mvdan/sh/releases
  KNFSD_TERRAFORM_VERSION: 1.2.9 # https://github.com/hashicorp/terraform/releases
  KNFSD_TFLINT_VERSION: 0.58.0 # https://github.com/terraform-linters/tflint/releases
  KNFSD_TFSEC_VERSION: 1.28.14 # https://github.com/aquasecurity/tfsec/releases
  KNFSD_TRIVY_VERSION: 0.63.0 # https://github.com/aquasecurity/trivy/releases

.renovate-config: &renovate-config
  environment: renovate
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'

.default-config: &default-config
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push"'
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never

# generic go cache configuration across all CI golang jobs
.go-config:
  stage: build
  variables:
    GOPROXY: direct
    GOPATH: /go
    GOMODCACHE: ${CI_PROJECT_DIR}/.go/pkg/mod
    GOCACHE: ${CI_PROJECT_DIR}/.go/.cache/go-build
    GOLANGCI_LINT_CACHE: ${CI_PROJECT_DIR}/.go/.cache/golangci-lint
  before_script:
    - mkdir -p ".go/pkg/mod" ".go/.cache/go-build" ".go/.cache/golangci-lint"
  allow_failure: true
  <<: *default-config
  tags:
    - arch:amd64
    - size:xlarge

# separate caches to control policy per CI job
.go-cache-mod: &go-cache-mod
  paths:
    - .go/pkg/mod

.go-cache-build: &go-cache-build
  paths:
    - .go/.cache/go-build

.go-cache-lint: &go-cache-lint
  paths:
    - .go/.cache/golangci-lint

# pre-hydrate go mod cache (except knfsd-metrics-agent project)
.go-mod-download: &go-mod-download
  script:
    - |
      # attempt 'go mod tidy/download' command max 3 iterations or until success
      set -euo pipefail
      function retry_command() {
        local retval=1
        local attempt=1
        until [[ $retval -eq 0 ]] || [[ $attempt -gt 3 ]]; do
          echo "retry_command: $1"
          set +e
          $1
          retval=$?
          set -e
          attempt=$((attempt + 1))
          if [[ $retval -ne 0 ]]; then
            echo "Command failed (attempt $attempt/3), retrying in 2 seconds..."
            sleep 2
          fi
        done
        if [[ $retval -ne 0 ]] && [[ $attempt -gt 3 ]]; then
          return $retval
        fi
      }
      retry_command "go mod tidy"
      retry_command "go mod download"

# specific gosec cache configuration across all CI gosec jobs
.gosec-config:
  stage: security
  variables:
    GOPROXY: direct
    GOPATH: /go
    GOMODCACHE: ${CI_PROJECT_DIR}/.go/pkg/mod
  image:
    name: ${CI_DEPENDENCY_PROXY_DIRECT_GROUP_IMAGE_PREFIX}/securego/gosec:${KNFSD_GOSEC_VERSION}
    entrypoint: [""]
  before_script:
    - mkdir -p ".go/pkg/mod"
  allow_failure: true
  <<: *default-config
  tags:
    - arch:amd64
    - size:xlarge

renovate-config-validator:
  stage: dependencies
  allow_failure: false
  <<: *renovate-config

renovate:
  stage: dependencies
  needs: ["renovate-config-validator"]
  variables:
    GOPROXY: direct
    RENOVATE_EXTRA_FLAGS: ${CI_PROJECT_NAMESPACE}/${CI_PROJECT_NAME}
  allow_failure: false
  <<: *renovate-config

editorconfig-check:
  stage: config
  needs: []
  image:
    name: ${CI_DEPENDENCY_PROXY_DIRECT_GROUP_IMAGE_PREFIX}/mstruebing/editorconfig-checker:v${KNFSD_EDITORCONFIG_VERSION}
    entrypoint: [""]
  script:
    - ec
  allow_failure: false
  <<: *default-config

# https://github.com/codespell-project/codespell
spell-check:
  stage: config
  needs: []
  image:
    name: ${CI_DEPENDENCY_PROXY_DIRECT_GROUP_IMAGE_PREFIX}/python:${KNFSD_PYTHON_VERSION}-alpine
    entrypoint: [""]
  before_script:
    - apk update
    - pip3 install --break-system-packages codespell==${KNFSD_CODESPELL_VERSION}
    - codespell --version
  script:
    - codespell
  allow_failure: false
  <<: *default-config

# https://github.com/koalaman/shellcheck
bash-check:
  stage: shell
  needs: []
  image:
    name: ${CI_DEPENDENCY_PROXY_DIRECT_GROUP_IMAGE_PREFIX}/koalaman/shellcheck-alpine:v${KNFSD_SHELLCHECK_VERSION}
    entrypoint: [""]
  before_script:
    - apk update && apk add --no-cache git
    - shellcheck --version
  script:
    - git ls-files --exclude='*.bash' --ignored -c -z | xargs -0r shellcheck --shell=bash --external-sources --color=always --severity=style
  allow_failure: true
  <<: *default-config

# https://github.com/koalaman/shellcheck
bats-check:
  stage: shell
  needs: []
  image:
    name: ${CI_DEPENDENCY_PROXY_DIRECT_GROUP_IMAGE_PREFIX}/koalaman/shellcheck-alpine:v${KNFSD_SHELLCHECK_VERSION}
    entrypoint: [""]
  before_script:
    - apk update && apk add --no-cache git
    - shellcheck --version
  script:
    - git ls-files --exclude='*.bats' --ignored -c -z | xargs -0r shellcheck --shell=bash --external-sources --color=always --severity=style
  allow_failure: true
  <<: *default-config

# https://github.com/koalaman/shellcheck
sh-check:
  stage: shell
  needs: []
  image:
    name: ${CI_DEPENDENCY_PROXY_DIRECT_GROUP_IMAGE_PREFIX}/koalaman/shellcheck-alpine:v${KNFSD_SHELLCHECK_VERSION}
    entrypoint: [""]
  before_script:
    - apk update && apk add --no-cache git
    - shellcheck --version
  script:
    - git ls-files --exclude='*.sh' --ignored -c -z | xargs -0r shellcheck --shell=bash --external-sources --color=always --severity=style
  allow_failure: true
  <<: *default-config

# https://github.com/mvdan/sh
sh-format:
  stage: shell
  needs: []
  image:
    name: ${CI_DEPENDENCY_PROXY_DIRECT_GROUP_IMAGE_PREFIX}/mvdan/shfmt:v${KNFSD_SHFMT_VERSION}-alpine
  before_script:
    - shfmt -version
  script:
    # https://github.com/mvdan/sh/blob/master/cmd/shfmt/shfmt.1.scd
    - shfmt -d -s "${CI_PROJECT_DIR}"
  allow_failure: true
  <<: *default-config

hcl-format:
  stage: packer
  needs: []
  image:
    name: ${CI_DEPENDENCY_PROXY_DIRECT_GROUP_IMAGE_PREFIX}/hashicorp/packer:${KNFSD_PACKER_VERSION}
    entrypoint:
      - '/usr/bin/env'
      - 'PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin'
  script:
    - packer --version
    - packer init -upgrade "${CI_PROJECT_DIR}/image"
    - packer fmt -check -diff -recursive "${CI_PROJECT_DIR}"
  allow_failure: false
  <<: *default-config

hcl-validate-image:
  stage: packer
  needs: []
  image:
    name: ${CI_DEPENDENCY_PROXY_DIRECT_GROUP_IMAGE_PREFIX}/hashicorp/packer:${KNFSD_PACKER_VERSION}
    entrypoint:
      - '/usr/bin/env'
      - 'PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin'
  script:
    - packer --version
    - cd "${CI_PROJECT_DIR}/image/" || exit 1
    - packer init -upgrade .
    - packer validate .
  allow_failure: false
  <<: *default-config

