tf-format:
  stage: terraform
  needs: []
  image:
    name: ${CI_DEPENDENCY_PROXY_DIRECT_GROUP_IMAGE_PREFIX}/hashicorp/terraform:${KNFSD_TERRAFORM_VERSION}
    entrypoint: [""]
  script:
    - terraform fmt -list=true -recursive -diff=true -check=true "${CI_PROJECT_DIR}"
  allow_failure: false
  <<: *default-config

tf-lint:
  stage: terraform
  needs: []
  image:
    name: ${CI_DEPENDENCY_PROXY_DIRECT_GROUP_IMAGE_PREFIX}/alpine:${KNFSD_ALPINE_VERSION}
    entrypoint: [""]
  script:
    - apk --no-cache add curl unzip
    # https://github.com/terraform-linters/tflint/releases
    - curl -L "https://github.com/terraform-linters/tflint/releases/download/v${KNFSD_TFLINT_VERSION}/tflint_linux_amd64.zip" -o tflint.zip
    - unzip -q -o tflint.zip
    - rm tflint.zip
    - chmod +x tflint
    - ./tflint -v
    - ./tflint --init
    - ./tflint --recursive --config="${CI_PROJECT_DIR}/.tflint.hcl"
  allow_failure: false
  <<: *default-config

tf-validate:
  stage: terraform
  needs: []
  image:
    name: ${CI_DEPENDENCY_PROXY_DIRECT_GROUP_IMAGE_PREFIX}/hashicorp/terraform:${KNFSD_TERRAFORM_VERSION}
    entrypoint: [""]
  variables:
    TF_PLUGIN_CACHE_DIR: ${CI_PROJECT_DIR}/.terraform.d/plugin-cache
  before_script:
    - mkdir -p "${CI_PROJECT_DIR}/.terraform.d/plugin-cache"
  cache:
    key: tf-plugins-${CI_COMMIT_REF_SLUG}
    paths:
      - deployment/database/.terraform.lock.hcl
      - deployment/metrics/.terraform.lock.hcl
      - deployment/terraform-module-knfsd/.terraform.lock.hcl
      - deployment/terraform-module-knfsd/modules/dns_round_robin/.terraform.lock.hcl
      - deployment/terraform-module-knfsd/modules/loadbalancer/.terraform.lock.hcl
      - examples/basic/.terraform.lock.hcl
      - examples/standard/.terraform.lock.hcl
      - image/smoke-tests/terraform/.terraform.lock.hcl
      - testing/examples/common/.terraform.lock.hcl
      - testing/modules/cloudbuild/.terraform.lock.hcl
      - testing/modules/source/.terraform.lock.hcl
      - .terraform.d/plugin-cache
  script:
    - |
      export SHELL_BLUE='\033[0;34m'; export SHELL_DEFAULT='\033[0m'
      FAILED=0
      while IFS= read -r dir; do
        echo -e "\nValidating: ${SHELL_BLUE}${dir}${SHELL_DEFAULT}"
        cd "${CI_PROJECT_DIR}/${dir}" || exit 1
        terraform init -backend=false -reconfigure -upgrade
        if ! terraform validate; then
          FAILED=1
        fi
      done < <(find . -type f -name '*.tf' | sed -e 's#/[^/]*$##' | sort -u)
      exit ${FAILED}
  allow_failure: false
  <<: *default-config
  tags:
    - arch:amd64
    - size:2xlarge

py-black: # python black formatter
  stage: python
  needs: []
  image:
    name: ${CI_DEPENDENCY_PROXY_DIRECT_GROUP_IMAGE_PREFIX}/python:${KNFSD_PYTHON_VERSION}-alpine
    entrypoint: [""]
  before_script:
    - apk update
    - apk --no-cache add util-linux
    - pip3 install --break-system-packages black==${KNFSD_BLACK_VERSION}
    - black --version
  script:
    # Use `script` to emulate `tty` for colored output in GitLab CI
    - script -q -c 'black --target-version py313 --check --diff "${CI_PROJECT_DIR}" ; echo $? > BLKEXIT'
    - exit $(cat BLKEXIT)
  allow_failure: false
  <<: *default-config

py-mypy: # python mypy type checker
  stage: python
  needs: []
  image:
    name: ${CI_DEPENDENCY_PROXY_DIRECT_GROUP_IMAGE_PREFIX}/python:${KNFSD_PYTHON_VERSION}-alpine
    entrypoint: [""]
  cache:
    key: mypy-${CI_COMMIT_REF_SLUG}
    paths:
      - ".mypy_cache"
  before_script:
    - mkdir -p ".mypy_cache"
    - apk update
    - apk --no-cache add util-linux
    - pip3 install --break-system-packages mypy==${KNFSD_MYPY_VERSION} boto3==${KNFSD_BOTO3_VERSION} psycopg==${KNFSD_PSYCOPG_VERSION}
    - mypy --version
  script:
    # Use `script` to emulate `tty` for colored output in GitLab CI
    - script -q -c 'mypy --follow-untyped-imports --show-error-context --pretty "${CI_PROJECT_DIR}" ; echo $? > MYPYEXIT'
    - exit $(cat MYPYEXIT)
  allow_failure: false
  <<: *default-config

py-pylint: # python pylint linter
  stage: python
  needs: []
  image:
    name: ${CI_DEPENDENCY_PROXY_DIRECT_GROUP_IMAGE_PREFIX}/python:${KNFSD_PYTHON_VERSION}-alpine
    entrypoint: [""]
  before_script:
    - apk update
    - apk --no-cache add util-linux
    - pip3 install --break-system-packages pylint==${KNFSD_PYLINT_VERSION} boto3==${KNFSD_BOTO3_VERSION} psycopg==${KNFSD_PSYCOPG_VERSION}
    - pylint --version
  script:
    # Use `script` to emulate `tty` for colored output in GitLab CI
    - script -q -c 'pylint --output-format=colorized "${CI_PROJECT_DIR}" ; echo $? > PYLINTEXIT'
    - exit $(cat PYLINTEXIT)
  allow_failure: false
  <<: *default-config

bats-deploy-build:
  stage: test
  needs: []
  image:
    name: gcr.io/kaniko-project/executor:v${KNFSD_KANIKO_VERSION}-debug
    entrypoint: [""]
  script:
    - mkdir -p /kaniko/.docker
    - echo "{\"auths\":{\"${CI_REGISTRY}\":{\"auth\":\"$(printf "%s:%s" "${CI_REGISTRY_USER}" "${CI_REGISTRY_PASSWORD}" | base64 | tr -d '\n')\"},\"$(echo -n $CI_DEPENDENCY_PROXY_SERVER | awk -F[:] '{print $1}')\":{\"auth\":\"$(printf "%s:%s" ${CI_DEPENDENCY_PROXY_USER} "${CI_DEPENDENCY_PROXY_PASSWORD}" | base64 | tr -d '\n')\"}}}" > /kaniko/.docker/config.json
    - >-
      /kaniko/executor
      --context "${CI_PROJECT_DIR}"
      --dockerfile "${CI_PROJECT_DIR}/deployment/terraform-module-knfsd/resources/tests/Dockerfile"
      --destination "${CI_REGISTRY_IMAGE}/bats-deploy:${CI_COMMIT_REF_SLUG}"
      --cache=true
  allow_failure: false
  <<: *default-config

# https://bats-core.readthedocs.io/en/stable/usage.html
bats-deploy-test:
  stage: test
  needs: ["bats-deploy-build"]
  image:
    name: ${CI_REGISTRY_IMAGE}/bats-deploy:${CI_COMMIT_REF_SLUG}
    entrypoint: [""]
  script:
    - cd "${CI_PROJECT_DIR}/deployment/terraform-module-knfsd/resources/" || exit 1
    - bats --formatter pretty --recursive ${1-tests}
  allow_failure: false
  <<: *default-config

go-filter-exports 1/5: # populate-cache
  extends: .go-config
  cache:
    - key: fe-mod-${CI_COMMIT_REF_SLUG}
      <<: *go-cache-mod
  image: ${CI_DEPENDENCY_PROXY_DIRECT_GROUP_IMAGE_PREFIX}/golang:${KNFSD_GOLANG_VERSION}
  needs: []
  before_script:
    - cd "${CI_PROJECT_DIR}/image/resources/filter-exports/" || exit 1
  <<: *go-mod-download

go-filter-exports 2/5: # lint,format
  extends: .go-config
  cache:
    - key: fe-mod-${CI_COMMIT_REF_SLUG}
      <<: *go-cache-mod
      policy: pull
    - key: fe-lint-${CI_COMMIT_REF_SLUG}
      <<: *go-cache-lint
    - key: fe-build-${CI_JOB_NAME}-${CI_COMMIT_REF_SLUG}
      <<: *go-cache-build
  image:
    name: ${CI_DEPENDENCY_PROXY_DIRECT_GROUP_IMAGE_PREFIX}/golangci/golangci-lint:v${KNFSD_GOLANGCI_LINT_VERSION}-alpine
    entrypoint: [""]
  needs: ["go-filter-exports 1/5"]
  script: # https://golangci-lint.run/usage/configuration/#command-line-options
    - cd "${CI_PROJECT_DIR}/image/resources/filter-exports/" || exit 1
    - golangci-lint run --config="${CI_PROJECT_DIR}/.golangci.yaml" --verbose

go-filter-exports 3/5: # https://go.dev/blog/vuln
  extends: .go-config
  cache:
    - key: fe-mod-${CI_COMMIT_REF_SLUG}
      <<: *go-cache-mod
      policy: pull
    - key: fe-build-${CI_JOB_NAME}-${CI_COMMIT_REF_SLUG}
      <<: *go-cache-build
  image: ${CI_DEPENDENCY_PROXY_DIRECT_GROUP_IMAGE_PREFIX}/golang:${KNFSD_GOLANG_VERSION}
  needs: ["go-filter-exports 1/5"]
  script:
    - cd "${CI_PROJECT_DIR}/image/resources/filter-exports/" || exit 1
    - go install golang.org/x/vuln/cmd/govulncheck@v${KNFSD_GOVULNCHECK_VERSION}
    - govulncheck -test -show verbose ./...

go-filter-exports 4/5: # test,vet,race,cover
  extends: .go-config
  cache:
    - key: fe-mod-${CI_COMMIT_REF_SLUG}
      <<: *go-cache-mod
      policy: pull
    - key: fe-build-${CI_JOB_NAME}-${CI_COMMIT_REF_SLUG}
      <<: *go-cache-build
  image: ${CI_DEPENDENCY_PROXY_DIRECT_GROUP_IMAGE_PREFIX}/golang:${KNFSD_GOLANG_VERSION}
  needs: ["go-filter-exports 1/5"]
  script:
    - cd "${CI_PROJECT_DIR}/image/resources/filter-exports/" || exit 1
    - go test -race -cover -vet=all -v ./...

go-filter-exports 5/5: # build
  extends: .go-config
  cache:
    - key: fe-mod-${CI_COMMIT_REF_SLUG}
      <<: *go-cache-mod
      policy: pull
    - key: fe-build-${CI_JOB_NAME}-${CI_COMMIT_REF_SLUG}
      <<: *go-cache-build
  image: ${CI_DEPENDENCY_PROXY_DIRECT_GROUP_IMAGE_PREFIX}/golang:${KNFSD_GOLANG_VERSION}
  needs: ["go-filter-exports 1/5"]
  script:
    - cd "${CI_PROJECT_DIR}/image/resources/filter-exports/" || exit 1
    - GOOS=linux GOARCH=amd64 go build -o "${CI_PROJECT_DIR}/filter-exports-amd64"
    - GOOS=linux GOARCH=arm64 go build -o "${CI_PROJECT_DIR}/filter-exports-arm64"

go-knfsd-agent 1/4: # populate-cache
