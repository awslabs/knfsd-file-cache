trivy:
  stage: security
  needs: []
  image:
    name: ${CI_DEPENDENCY_PROXY_DIRECT_GROUP_IMAGE_PREFIX}/aquasec/trivy:${KNFSD_TRIVY_VERSION}
    entrypoint: [""]
  cache:
    key: trivy-${CI_COMMIT_REF_SLUG}
    paths:
      - ".trivycache"
  before_script:
    - mkdir -p ".trivycache"
    - apk --no-cache add util-linux
  script:
    - trivy --version
    # Use `script` to emulate `tty` for colored output in GitLab CI
    - script -q -c 'trivy fs --ignorefile .trivyignore.yaml --exit-code 1 --cache-dir ".trivycache" --scanners secret,vuln,misconfig,license "${CI_PROJECT_DIR}" ; echo $? > TRIVYEXIT'
    - exit $(cat TRIVYEXIT)
  allow_failure: true
  <<: *default-config
