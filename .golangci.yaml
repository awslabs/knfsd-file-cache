version: "2"
linters:
  default: none
  enable:
    - errcheck
    - errname
    - gocritic
    - gosec
    - govet
    - ineffassign
    - misspell
    - staticcheck
    - unconvert
    - unused
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - path: _test\.go
        linters:
          - errcheck
      - path: '(^|/)testcert\.go$'
        linters:
          - misspell
formatters:
  enable:
    - gofmt
  exclusions:
    generated: lax
